[project]
name = "unirobolab"
version = "0.0.2"
description = "UniRoboLab: contract-driven policy packaging, sim2sim checks and training backend. Not published to PyPI; installed by the Unity binary via uv."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.24",
  "onnx>=1.14",
  "pyyaml>=6",
]

[project.optional-dependencies]
# onnxruntime is needed to run a policy (the generated ROS 2 node and make-test-policy's
# self-check). It is a separate extra so a machine that only generates packages
# does not need it.
runtime = ["onnxruntime>=1.16"]
dev = ["onnxruntime>=1.16", "jsonschema>=4.0", "pytest>=7"]

[project.scripts]
unirobolab = "unirobolab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unirobolab"]
