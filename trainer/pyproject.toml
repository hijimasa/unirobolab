[project]
name = "unirobolab-trainer"
version = "0.0.1"
description = "Training backend for UniRoboLab. Bundled with the Unity binary via uv; not published to PyPI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
unirobolab-train = "unirobolab_trainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unirobolab_trainer"]
